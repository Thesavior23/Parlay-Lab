name: Update picks

on:
  schedule:
    # times are UTC. San Antonio (Central): 9am / 3pm / 4:30pm in winter, 10am / 4pm / 5:30pm in summer
    - cron: "0 15 * * *"    # morning picks
    - cron: "0 21 * * *"    # afternoon injury news
    - cron: "30 22 * * *"   # last update before the first tip-offs
  workflow_dispatch: {}     # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore saved downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - name: Build today's picks
        run: python build_data.py
      - name: Save picks to the website
        run: |
          git config user.name "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "Update picks $(date -u +%F' '%H:%M)" || echo "Nothing changed"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
